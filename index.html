<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TripBudget</title>
<meta name="description" content="วางแผนทริป: เตรียมของ งบประมาณ และเคล็ดลับไปต่างประเทศครั้งแรก ใช้งานออฟไลน์ได้">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: mobile-first single column, white ground, bottom tab bar; trip header styled as a boarding-pass stub */
:root{
  --bg:#ffffff; --soft:#f4f6f8; --soft2:#e9edf1; --line:#e3e7ec; --line2:#cfd6de;
  --ink:#17202b; --ink2:#4b5867; --ink3:#8793a1;
  --acc:#0e8f8a; --acc-soft:#e2f4f3; --acc-ink:#0a6c68;
  --good:#16834a; --good-soft:#e5f5ec; --warn:#b86200; --warn-soft:#fff3e0; --bad:#cf3434; --bad-soft:#fdecec;
  --f-body:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --r:14px; --rs:10px; --nav:64px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--rs);padding:10px 12px;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:500}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
h1{font-size:22px;line-height:1.25;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.muted{color:var(--ink3);font-size:13px}
.small{font-size:12.5px}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px 16px;display:flex;align-items:center;gap:8px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.3px;white-space:nowrap}.logo b{color:var(--acc)}
#topTrip{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.ib:active{background:var(--soft)}
#menu{position:absolute;right:8px;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(20,32,48,.16);padding:6px;min-width:232px}
#menu button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-size:14.5px}#menu button:active{background:var(--soft)}
#menu .ft{font-size:11.5px;color:var(--ink3);padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:4px}
.offpill{font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px}

main{max-width:720px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:var(--soft);border-color:transparent}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}.ch h2{flex:1}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.right{text-align:right}.mt{margin-top:12px}.mt-s{margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .full{grid-column:1/-1}
@media(max-width:360px){.g2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;white-space:nowrap;min-height:44px}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:active{background:var(--acc-ink)}
.btn.ghost{border:1px solid var(--line2);background:#fff;color:var(--ink2)}.btn.ghost:active{background:var(--soft)}
.btn.danger{border:1px solid #f1c4c4;color:var(--bad);background:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.link{color:var(--acc-ink);font-weight:600;text-decoration:underline;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;flex-shrink:0;border:1px solid var(--line2);border-radius:99px;padding:7px 13px;font-size:13.5px;background:#fff;color:var(--ink2);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
.scrollx .chips{flex-wrap:nowrap}

.bar{height:8px;background:var(--soft2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.good i{background:var(--good)}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px}.alert.good{background:var(--good-soft);color:var(--good)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.info{background:var(--soft);color:var(--ink2)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.buy{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:40px 16px;color:var(--ink3)}.empty .e{font-size:42px;margin-bottom:8px}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}.empty p{margin-bottom:16px;font-size:14px}

/* boarding-pass trip header */
.pass{display:flex;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;position:relative;background:#fff}
.pass .main{flex:1;min-width:0;padding:14px 14px 14px 16px}
.pass .stub{width:96px;flex-shrink:0;padding:12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;border-left:2px dashed var(--line2);position:relative;background:var(--acc-soft);border-radius:0 var(--r) var(--r) 0}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass .stub::before{top:-10px;border-top-color:transparent;border-left-color:transparent;transform:rotate(45deg)}
.pass .stub::after{bottom:-10px;border-bottom-color:transparent;border-right-color:transparent;transform:rotate(45deg)}
.pass .big{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.05;color:var(--acc-ink)}
.pass .lbl{font-size:11.5px;color:var(--acc-ink);font-weight:600;letter-spacing:.2px}
.pass .code{font-family:var(--f-num);font-size:11px;letter-spacing:1.5px;color:var(--ink3);text-transform:uppercase}
.pass .tn{font-weight:700;font-size:17px;line-height:1.3;margin:2px 0;word-break:break-word}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* trip list */
.trip{cursor:pointer}.trip.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.trip .flag{font-size:30px;line-height:1}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini div{font-size:12px;color:var(--ink3)}.mini b{display:block;font-size:13.5px;color:var(--ink);font-weight:600}.mini .bar{margin-top:4px;height:5px}

/* packing */
.cat{margin-bottom:6px}
.cat>.row{padding:12px 2px 6px;font-weight:700;font-size:14px;color:var(--ink2)}
.pk{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.pk .ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex-shrink:0;font-size:16px;color:transparent;font-weight:700}
.pk.done .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.pk.done .nm{color:var(--ink3);text-decoration:line-through}
.pk .body{flex:1;min-width:0;text-align:left;cursor:pointer}
.pk .nm{font-weight:500;word-break:break-word}
.pk .sub{font-size:12px;color:var(--ink3)}
.pk .q{font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--ink2);min-width:34px;text-align:right}

/* budget */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum3 div{background:var(--soft);border-radius:12px;padding:10px 6px}.sum3 b{display:block;font-size:16px}.sum3 span{font-size:12px;color:var(--ink3)}
.bc{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.bc:last-child{border-bottom:none}
.bc .ic{font-size:20px;grid-row:span 2;text-align:center}.bc .bar{grid-column:2/4}
.dayhd{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2);margin:16px 2px 6px}
.ex{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:#fff;width:100%;text-align:left}
.ex .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.ex .nm{font-weight:600;word-break:break-word}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);width:58px;height:58px;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 22px rgba(14,143,138,.35);z-index:40}
@media(min-width:760px){.fab{right:calc(50% - 360px + 18px)}}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:middle}.dot.off{background:var(--ink3)}

/* tips */
.tip{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}.tip:last-child{border-bottom:none}
.tip .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px}
.tip.done .ck{background:var(--good);border-color:var(--good);color:#fff}.tip.seq:not(.done) .ck{color:var(--acc-ink);border-color:var(--acc);font-family:var(--f-num);font-weight:600}
.tip.done .tt{color:var(--ink3)}
.tip .tt{font-weight:600}.tip .td{font-size:13.5px;color:var(--ink2);margin-top:2px}
.fact{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:none}.fact .ic{font-size:19px;grid-row:span 2}
.em{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.em a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:700;text-decoration:none;font-family:var(--f-num)}

/* template editor */
.te{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.te .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.te .opts select{width:auto;min-height:38px;padding:6px 10px;font-size:14px}
.te .opts input[type=number]{width:76px;min-height:38px;padding:6px 8px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:6px 10px;border:1px solid var(--line2);border-radius:99px;min-height:36px}
.tog input{width:auto;min-height:0;accent-color:var(--acc)}

/* nav */
.chip.ck input{width:auto;min-height:0;accent-color:var(--acc)}
.avatar{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.xfer{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.xfer:last-child{border-bottom:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11.5px;color:var(--ink3);padding-bottom:4px}
.cd{min-height:54px;border-radius:9px;padding:4px 5px;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.cd.in{background:var(--acc-soft);color:var(--ink);cursor:pointer}.cd.in b{font-size:10.5px;color:var(--acc-ink);font-family:var(--f-num);margin-top:auto}.cd.sel{outline:2px solid var(--acc)}.cd.today{box-shadow:inset 0 0 0 1.5px var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{font-size:12px;color:var(--ink3);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line)}table.t td.num{white-space:nowrap}table.t tr:last-child td{border-bottom:none}table.t .r{text-align:right}
.brow{display:flex;align-items:center;gap:10px;padding:7px 0}.brow .lb{width:118px;font-size:13px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .bar{flex:1}.brow .v{width:92px;text-align:right;font-size:13px}
.tgood{color:var(--good)}.tbad{color:var(--bad)}
.rem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.rem:last-child{border-bottom:none}
.rem .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:13px;color:transparent;flex-shrink:0}
.rem.late b{color:var(--bad)}.rem.today b{color:var(--warn)}
.pl{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.pl .tm{font-family:var(--f-num);font-weight:600;color:var(--acc-ink);min-width:46px;padding-top:1px}
.ib.sosb{color:var(--bad);font-size:13px;font-weight:700;width:auto;padding:0 10px;border:1.5px solid #f1c4c4;height:36px;border-radius:10px}
.sosnum{font-family:var(--f-num);font-weight:700;color:var(--bad);text-decoration:none}
#big{position:fixed;inset:0;z-index:400;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(64px + env(safe-area-inset-bottom,0px));text-align:center;cursor:pointer}
#big .bt{font-size:clamp(26px,7.5vw,50px);font-weight:700;line-height:1.35;word-break:break-word;color:var(--ink)}
#big .bs{font-size:19px;color:var(--ink2);margin-top:18px}
#big .bh{font-size:13px;color:var(--ink3);position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;max-width:140px;min-width:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink3);position:relative}
.nav button span{font-size:22px;line-height:1;filter:grayscale(1);opacity:.55}
.nav button.on{color:var(--acc-ink)}.nav button.on span{filter:none;opacity:1}
.nav button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.nav button:disabled{opacity:.35}

/* sheet + dialog */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(15,22,32,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px 0}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 10px}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sh b{font-size:17px}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:15px}
.sf{position:sticky;bottom:0;background:#fff;display:flex;gap:8px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--line)}
.sf .sp{flex:1}
#dlg{z-index:150;align-items:center;padding:16px}
.dlg{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.dlg h3{font-size:17px;margin-bottom:6px}.dlg .dt{font-size:14.5px;color:var(--ink2);margin-bottom:12px}
.seg{display:flex;background:var(--soft2);border-radius:10px;padding:3px}.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);min-height:38px}.seg button.on{background:#fff;color:var(--acc-ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.preview{font-size:14px;color:var(--acc-ink);font-weight:600;min-height:20px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.th{position:relative}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px}
.upload{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line2);border-radius:12px;padding:12px;color:var(--ink2);font-weight:600;cursor:pointer;font-size:14px}
#lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:grid;place-items:center}#lb img{max-width:94vw;max-height:88vh;border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 88px);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);text-align:center;animation:tin .25s}
.toast.warn{background:var(--warn)}.toast.bad{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="logo">Trip<b>Budget</b></div>
  <span class="offpill" id="offline" hidden>ออฟไลน์</span>
  <div id="topTrip"></div>
  <button class="ib sosb" id="sosBtn" data-act="go" data-v="sos" aria-label="การ์ดฉุกเฉิน" hidden>SOS</button>
  <button class="ib" data-act="menu" aria-label="เมนู">⋮</button>
  <div id="menu" hidden>
    <button data-act="editTrip">✏️ แก้ไขทริปนี้</button>
    <button data-act="shareTrip" id="shareBtn">📤 แชร์ทริปนี้ให้เพื่อน</button>
    <button data-act="go" data-v="sos">🆘 การ์ดฉุกเฉิน</button>
    <button data-act="go" data-v="templates">📝 แก้เทมเพลตเตรียมของ</button>
    <button data-act="exportData">💾 สำรองข้อมูล (.json)</button>
    <button data-act="importData">📂 กู้คืนข้อมูล</button>

<script>
'use strict';
/* ============ DATA ============ */
const KEY = 'tb_v4', RKEY = 'tb_rates', V3KEY = 'tb_v3';

const T = (name, cat, qty=1, perDay=false, buy='', key='') => ({name, cat, qty, perDay, buy, key});
const DEFAULT_TPL = () => ({
  common:[T('บัตรประชาชน','doc'), T('กระเป๋าสตางค์ + เงินสด','money'), T('บัตรเดบิต/เครดิต','money'),
    T('เสื้อ','clothes',1,true), T('กางเกง/กระโปรง','clothes',0.5,true), T('ชุดชั้นใน','clothes',1,true), T('ถุงเท้า','clothes',1,true), T('ชุดนอน','clothes'),
    T('แปรงสีฟัน + ยาสีฟัน','toiletry'), T('สบู่ แชมพู ขนาดพกพา','toiletry'), T('โฟมล้างหน้า/สกินแคร์','toiletry'),
    T('ยาประจำตัว','health'), T('ยาสามัญ (พารา แก้แพ้ แก้ท้องเสีย)','health'),
    T('โทรศัพท์ + สายชาร์จ','tech'), T('พาวเวอร์แบงก์','tech'), T('ถุงใส่ผ้าใช้แล้ว','other')],
  leisure:[T('แว่นกันแดด','other'), T('ครีมกันแดด','toiletry'), T('หมวก','clothes'), T('รองเท้าเดินสบาย','clothes'), T('ชุดว่ายน้ำ','clothes'), T('กล้อง + การ์ดหน่วยความจำ','tech')],
  business:[T('ชุดทำงาน','clothes',1,true), T('รองเท้าสุภาพ','clothes'), T('นามบัตร','doc'), T('เอกสารงาน/หนังสือเชิญ','doc'), T('โน้ตบุ๊ก + ที่ชาร์จ','tech'), T('ปากกา + สมุดโน้ต','other')],
  relative:[T('ของฝากญาติ','other',1,false,'shopping'), T('ผ้าเช็ดตัว','toiletry'), T('ยากันยุง','health'), T('ชุดสุภาพ (ไปวัด/งานบุญ)','clothes')],
  abroad:[T('พาสปอร์ต (อายุเหลืออย่างน้อย 6 เดือน)','doc'), T('วีซ่า / เอกสารเข้าประเทศ','doc'), T('ตั๋วเครื่องบิน + ใบจองที่พัก (เก็บแบบออฟไลน์)','doc'), T('สำเนาพาสปอร์ต','doc'),
    T('ประกันการเดินทาง','doc',1,false,'other','insurance'), T('eSIM / ซิมต่างประเทศ','tech',1,false,'other','esim'),
    T('เงินสกุลท้องถิ่น','money',1,false,'','cash'), T('บัตรที่ใช้ต่างประเทศได้','money'), T('ปลั๊กแปลงหัว','tech',1,false,'other','plug'),
    T('ปากกา (กรอกเอกสาร ตม.)','other'), T('ถุงซิปใส ใส่ของเหลว ≤ 100 มล.','toiletry'), T('เสื้อแขนยาวใส่บนเครื่องบิน','clothes'), T('หมอนรองคอ','other')]
});

/* ============ HELPERS ============ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const clone = o => JSON.parse(JSON.stringify(o));
function fmt(n, d){ n = num(n); if (d === undefined) d = Math.abs(n) >= 100 ? 0 : 2; return n.toLocaleString('th-TH', {maximumFractionDigits:d}); }
function money(n, c='THB'){
  n = num(n); const s = (CURR[c] || {s:c + ' '}).s;
  const d = ZERO_DEC.has(c) ? 0 : (c === 'THB' && Math.abs(n) >= 100 ? 0 : 2);
  return (n < 0 ? '-' : '') + s + fmt(Math.abs(n), d);
}
const fmtRate = r => !r ? '-' : r >= 1 ? String(+r.toFixed(3)) : String(+r.toPrecision(4));
const rateVal = r => !r ? '' : r >= 1 ? +r.toFixed(4) : +r.toPrecision(5);
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayIso = () => iso(new Date());
const thDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('th-TH', {day:'numeric', month:'short'}) : '';
const thDateY = s => s ? new Date(s + 'T00:00').toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}) : '';
function ago(t){ if (!t) return ''; const m = Math.round((Date.now() - new Date(t)) / 6e4);
  if (m < 1) return 'เมื่อสักครู่'; if (m < 60) return m + ' นาทีที่แล้ว'; const h = Math.round(m/60); if (h < 24) return h + ' ชม.ที่แล้ว'; return Math.round(h/24) + ' วันที่แล้ว'; }
function toast(msg, type=''){ const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; $('#toast').appendChild(el); setTimeout(() => el.remove(), 2800); }
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ============ STATE ============ */
let db = {trips:[], currentId:null, templates:null};
let rates = {rates:{}, at:null};
const ui = {tipTab:'check', view:'trips', packFilter:'todo', tplGroup:'common', expCat:'', form:null, expMode:'list', calDay:null, cmp:new Set()};
let deferredPrompt = null, S = null, dlgFetched = 0; // S = open sheet state

function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('บันทึกไม่สำเร็จ พื้นที่ในเครื่องเต็ม','bad'); } }
let st; const saveSoon = () => { clearTimeout(st); st = setTimeout(save, 300); };
const cur = () => db.trips.find(t => t.id === db.currentId) || null;
const tplWithIds = tpl => { for (const g in tpl) tpl[g] = tpl[g].map(x => ({id:uid(), ...x})); return tpl; };

/* ============ RECEIPTS (IndexedDB, ใช้ฐานเดียวกับเวอร์ชันก่อน) ============ */
const IDB = {
  d:null,
  open(){ if (this.d) return Promise.resolve(this.d);
    return new Promise((res, rej) => { const r = indexedDB.open('tripbudget', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('receipts');
      r.onsuccess = () => { this.d = r.result; res(this.d); }; r.onerror = () => rej(r.error); }); },
  async tx(mode, fn){ const d = await this.open(); return new Promise((res, rej) => {
    const t = d.transaction('receipts', mode), q = fn(t.objectStore('receipts')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  put(id, v){ return this.tx('readwrite', s => s.put(v, id)); },
  get(id){ return this.tx('readonly', s => s.get(id)); },
  del(id){ thumbs.delete(id); return this.tx('readwrite', s => s.delete(id)).catch(() => {}); }
};
const thumbs = new Map();
async function hydrate(root=document){
  for (const img of $$('img[data-rid]', root)) {
    if (img.getAttribute('src')) continue;
    const id = img.dataset.rid; let v = thumbs.get(id);
    if (!v) { try { v = await IDB.get(id); } catch {} if (v) thumbs.set(id, v); }
    if (v) img.src = v; else img.alt = 'ไม่พบรูป';
  }
}
function compress(file, max=1280, q=.72){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onload = () => { const im = new Image();
      im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width*s), h = Math.round(im.height*s);
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); res(c.toDataURL('image/jpeg', q)); };
      im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file); });
}

/* ============ RATES ============ */
const liveRate = c => (rates.rates || {})[c] || 0;
const anyRate = c => !c || c === 'THB' ? 1 : (liveRate(c) || FALLBACK[c] || 0);
async function fetchRates(){
  if (!navigator.onLine) return false;
  for (const u of ['https://open.er-api.com/v6/latest/THB', 'https://api.exchangerate-api.com/v4/latest/THB']) {
    try { const r = await fetch(u, {cache:'no-store'}); if (!r.ok) continue; const d = await r.json(); if (!d.rates) continue;
      const out = {}; for (const k in CURR) if (k !== 'THB' && d.rates[k]) out[k] = 1 / d.rates[k];
      rates = {rates:out, at:new Date().toISOString()}; try { localStorage.setItem(RKEY, JSON.stringify(rates)); } catch {}
      return true; } catch {}
  }
  return false;
}
const ratesFresh = () => rates.at && Date.now() - new Date(rates.at) < 3600e3;

/* ============ TRIP MODEL ============ */
const isAbroad = t => !!t.country && t.country !== 'TH';
const days = t => Math.max(1, parseInt(t.days) || 1);
const country = t => COUNTRIES[t.country] || null;
const endDate = t => { if (!t.startDate) return ''; const d = new Date(t.startDate + 'T00:00'); d.setDate(d.getDate() + days(t) - 1); return iso(d); };
const dayDate = (t, n) => { if (!t.startDate || n < 1) return ''; const d = new Date(t.startDate + 'T00:00'); d.setDate(d.getDate() + n - 1); return iso(d); };
const qtyOf = (t, it) => it.perDay ? Math.max(1, Math.ceil(num(it.qty) * days(t))) : Math.max(0, num(it.qty));
const fmtQty = q => +(+q).toFixed(2);
const expThb = e => num(e.amount) * (e.curr === 'THB' ? 1 : num(e.rate));
const budgetOf = (t, k) => k === 'food' ? num(t.budget.food) * days(t) : num(t.budget[k]);
const budgetTotal = t => Object.keys(BCATS).reduce((s, k) => s + budgetOf(t, k), 0);
const usedOf = (t, k) => t.expenses.filter(e => e.cat === k).reduce((s, e) => s + expThb(e), 0);
const usedTotal = t => t.expenses.reduce((s, e) => s + expThb(e), 0);
const COLORS = ['#0e8f8a','#6d4ae0','#b86200','#2563eb','#c0306f','#16834a','#8a5a2b','#5a6b8a'];
const pax = t => Math.max(1, t.members.length);
const mName = (t, id) => (t.members.find(m => m.id === id) || {}).name || '?';
const mColor = (t, id) => COLORS[Math.max(0, t.members.findIndex(m => m.id === id)) % COLORS.length];
const initial = s => { const a = [...String(s || '?').replace(/^[เแโใไ]+/, '')]; return a[0] || '?'; };
const avatar = (t, id) => `<span class="avatar" style="background:${mColor(t, id)}">${esc(initial(mName(t, id)))}</span>`;
function balances(t){
  const b = {}; t.members.forEach(m => b[m.id] = {paid:0, share:0});
  t.expenses.forEach(e => { const amt = expThb(e), among = (e.splitAmong || []).filter(id => b[id]); const ids = among.length ? among : t.members.map(m => m.id);
    if (b[e.paidBy]) b[e.paidBy].paid += amt; ids.forEach(id => b[id].share += amt / ids.length); });
  return b;
}
function settle(t){
  const b = balances(t), cr = [], db_ = [];
  for (const id in b) { const n = b[id].paid - b[id].share; if (n > .5) cr.push({id, a:n}); else if (n < -.5) db_.push({id, a:-n}); }
  cr.sort((x, y) => y.a - x.a); db_.sort((x, y) => y.a - x.a);
  const out = []; let i = 0, j = 0;
  while (i < db_.length && j < cr.length) { const x = Math.min(db_[i].a, cr[j].a); if (x > .5) out.push({from:db_[i].id, to:cr[j].id, amt:x});
    db_[i].a -= x; cr[j].a -= x; if (db_[i].a < .5) i++; if (cr[j].a < .5) j++; }
  return out;
}

function groupsFor(type, abroad){
  const g = ['common']; if (['leisure','business','relative'].includes(type)) g.push(type);
  if (abroad || type === 'abroad') g.push('abroad'); return g;
}
function tplItemsFor(t){
  const seen = new Set(), out = [];
  for (const g of groupsFor(t.type, isAbroad(t))) for (const it of db.templates[g] || []) {
    const k = it.key || it.name.trim(); if (seen.has(k)) continue; seen.add(k);
    out.push({id:uid(), name:it.name, cat:it.cat, qty:num(it.qty), perDay:!!it.perDay, buy:it.buy || '', key:it.key || '', checked:false, expId:''});
  }
  return out;
}
function missingFromTpl(t){
  const have = new Set(t.packing.map(p => p.key || p.name.trim()));
  return tplItemsFor(t).filter(p => !have.has(p.key || p.name.trim()));
}
function plugInfo(c){
  if (!c || !c.p) return null;
  const types = c.p.split(','), A = types.includes('A'), C = types.includes('C');
  let need;
  if (A && C) need = 'ปลั๊กไทยทั้งขาแบนและขากลมเสียบได้เลย';
  else if (A) need = 'ปลั๊กขาแบน (A) เสียบได้ ขากลม (C) ต้องใช้ตัวแปลง';
  else if (C) need = 'ปลั๊กขากลม (C) เสียบได้ ขาแบน (A) ต้องใช้ตัวแปลง';
  else need = `ต้องใช้ตัวแปลงหัวแบบ Type ${types.join('/')}`;
  const volt = c.v && c.v < 200 ? ` · ไฟ ${c.v}V (ไทย 230V) ดูที่อะแดปเตอร์ว่ารองรับ 100–240V` : (c.v ? ` · ไฟ ${c.v}V` : '');
  return {types:'Type ' + types.join(', '), need, volt, short:A && C ? 'ไม่ต้องแปลง' : 'ต้องแปลง'};
}
function normalizeTrip(t){
  t.id = t.id || uid(); t.name = t.name || ''; t.type = TYPES[t.type] ? t.type : 'leisure';
  t.country = COUNTRIES[t.country] ? t.country : (t.country ? 'OTHER' : 'TH');
  t.currency = t.currency || (COUNTRIES[t.country] || {}).c || 'THB';
  if (!isAbroad(t)) t.currency = 'THB';
  t.rate = t.currency === 'THB' ? 1 : (num(t.rate) || anyRate(t.currency));
  t.startDate = t.startDate || ''; t.days = days(t);
  t.budget = Object.assign({ticket:0, hotel:0, food:0, transport:0, shopping:0, other:0}, t.budget || {});
  t.packing = Array.isArray(t.packing) ? t.packing : [];
  t.packing.forEach(p => { p.id = p.id || uid(); p.cat = PACK_CATS[p.cat] ? p.cat : 'other'; p.qty = num(p.qty); p.perDay = !!p.perDay; p.buy = BCATS[p.buy] ? p.buy : ''; p.key = p.key || ''; p.checked = !!p.checked; p.expId = p.expId || ''; });
  t.members = Array.isArray(t.members) && t.members.length ? t.members.map(m => ({id:m.id || uid(), name:String(m.name || '').trim() || '?'})) : [{id:uid(), name:'ฉัน'}];
  const ids = t.members.map(m => m.id);
  t.expenses = Array.isArray(t.expenses) ? t.expenses : [];
  t.expenses.forEach(e => { e.id = e.id || uid();
    if (!ids.includes(e.paidBy)) e.paidBy = ids[0]; e.splitAmong = (e.splitAmong || []).filter(x => ids.includes(x)); if (!e.splitAmong.length) e.splitAmong = [...ids]; e.cat = BCATS[e.cat] ? e.cat : 'other'; e.curr = e.curr || 'THB';
    e.rate = e.curr === 'THB' ? 1 : (num(e.rate) || t.rate); e.day = Math.max(0, parseInt(e.day) || 0); e.name = e.name || BCATS[e.cat].n;
    e.note = e.note || ''; e.receipts = Array.isArray(e.receipts) ? e.receipts.filter(r => typeof r === 'string' && !r.startsWith('data:')) : []; });
  t.tipsDone = t.tipsDone || {}; t.remDone = t.remDone || {};
  t.sos = Object.assign({hotel:'', hotelAddr:'', hotelPhone:'', insurer:'', policy:'', insPhone:'', embassy:'', note:''}, t.sos || {});
  t.plan = (Array.isArray(t.plan) ? t.plan : []).map(x => ({id:x.id || uid(), day:Math.max(1, parseInt(x.day) || 1), time:x.time || '', title:x.title || '', place:x.place || '', note:x.note || ''}));
  t.docs = (Array.isArray(t.docs) ? t.docs : []).map(d => ({id:d.id || uid(), title:d.title || '', kind:d.kind || 'other', files:(Array.isArray(d.files) ? d.files : []).filter(f => f && f.id)}));
  return t;
}
function newTrip(f){
  const t = normalizeTrip({id:uid(), name:f.name, type:f.type, country:f.country, currency:f.currency, rate:f.rate, rateAt:f.rateAt,
    startDate:f.startDate, days:f.days, members:f.members, createdAt:Date.now()});
  t.packing = tplItemsFor(t);
  return t;
}

/* ============ MIGRATION (v3 → v4) ============ */
function fromV3(o){
  const mc = String(o.mainCurr || '').toUpperCase();
  let c = COUNTRIES[o.country] ? o.country : (o.country ? 'OTHER' : (mc && mc !== 'THB' ? 'OTHER' : 'TH'));
  const currency = c === 'TH' ? 'THB' : (mc || (COUNTRIES[c] || {}).c || 'THB');
  let d = 1;
  if (o.startDate && o.endDate) d = Math.round((new Date(o.endDate + 'T00:00') - new Date(o.startDate + 'T00:00')) / 864e5) + 1;
  else d = Math.max(1, ...(o.expenses || []).map(e => parseInt(e.day) || 1));
  const pax_ = Math.max(1, (o.members || []).length), first = ((o.members || [])[0] || {}).id;
  const t = {id:o.id || uid(), name:o.name || '', type:c !== 'TH' ? 'abroad' : 'leisure', country:c, currency, rate:anyRate(currency),
    startDate:o.startDate || '', days:Math.max(1, d), createdAt:o.createdAt || Date.now(), budget:{other:num(o.budget)}, members:o.members || [], expenses:[], packing:[]};
  const f = o.flight || {}, add = (name, cat, amount, curr='THB', rate=1, note='', paidBy=first) => { if (num(amount) > 0) t.expenses.push({id:uid(), name, cat, amount:num(amount), curr, rate, day:0, note, paidBy, receipts:[]}); };
  add(('ตั๋วเครื่องบิน ' + (f.airline || '') + ' ' + (f.flightNo || '')).trim(), 'ticket', num(f.price) * pax_, 'THB', 1, pax_ > 1 ? pax_ + ' คน' : '');

function countdown(t){
  if (!t.startDate) return {big:days(t), lbl:'วัน', sub:'ยังไม่ระบุวัน'};
  const today = new Date(todayIso() + 'T00:00'), s = new Date(t.startDate + 'T00:00'), e = new Date(endDate(t) + 'T00:00');
  const diff = Math.round((s - today) / 864e5);
  if (diff > 0) return {big:diff, lbl:'วันก่อนออกเดินทาง', sub:''};
  if (diff === 0) return {big:'วันนี้', lbl:'ออกเดินทาง!', sub:''};
  if (today <= e) { const n = Math.round((today - s) / 864e5) + 1; return {big:n + '/' + days(t), lbl:'วันที่ของทริป', sub:''}; }
  return {big:'✓', lbl:'จบทริปแล้ว', sub:''};
}
function currentDay(t){
  if (!t.startDate) return 0; const n = Math.round((new Date(todayIso() + 'T00:00') - new Date(t.startDate + 'T00:00')) / 864e5) + 1;
  return n >= 1 && n <= days(t) ? n : 0;
}

        <label class="f">สกุล<select name="curr"><option value="THB">฿ บาท</option>${ab ? `<option value="${t.currency}">${t.currency}</option>` : ''}</select></label>
        ${t.members.length > 1 ? `<label class="f full">ใครจ่าย (หารทุกคน)<select name="paidBy">${t.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>` : ''}</div>`,
        ok:'บันทึกรายจ่าย', cancel:'ข้าม'});
      if (r) {
        const amt = num(r.amount); if (amt <= 0) { toast('ไม่ได้ใส่จำนวนเงิน เลยยังไม่บันทึก', 'warn'); return; }
        const e = {id:uid(), name:p.name, cat:p.buy, amount:amt, curr:r.curr, rate:r.curr === 'THB' ? 1 : t.rate, day:0, note:'จากลิสต์เตรียมของ', receipts:[], paidBy:r.paidBy || t.members[0].id, splitAmong:t.members.map(m => m.id)};
        t.expenses.push(e); p.expId = e.id; save(); render(); toast(`บันทึก ${money(expThb(e))} ในงบ${BCATS[p.buy].n}แล้ว`);
      }
    }
  } else {
    p.checked = false;
    const e = p.expId && t.expenses.find(x => x.id === p.expId);
    save(); render();
    if (e && await dialog({title:'ลบรายจ่ายที่ผูกไว้ด้วยไหม?', text:`"${e.name}" ${money(expThb(e))}`, ok:'ลบรายจ่าย', cancel:'เก็บไว้', danger:true})) {
      t.expenses = t.expenses.filter(x => x !== e); p.expId = ''; save(); render(); toast('ลบรายจ่ายแล้ว', 'warn');
    }
  }
}

/* ============ VIEW: BUDGET ============ */
function vBudget(){
  const t = cur(); if (!t) return needTrip();
  const bt = budgetTotal(t), u = usedTotal(t), left = bt - u, ab = isAbroad(t) && t.currency !== 'THB';
  const cd = currentDay(t), remDays = cd ? days(t) - cd + 1 : (t.startDate && todayIso() < t.startDate ? days(t) : 0);
  let alert = '';
  if (!bt) alert = `<div class="alert info mt">ยังไม่ได้ตั้งงบ <button class="link" data-act="editBudget">ตั้งงบตามหมวด</button></div>`;
  else if (left < 0) alert = `<div class="alert bad mt">⚠️ เกินงบแล้ว ${money(-left)}</div>`;
  else if (pct(u, bt) > 85) alert = `<div class="alert warn mt">⚡ ใช้ไปแล้ว ${pct(u, bt)}% ของงบ</div>`;
  const foodLeft = budgetOf(t, 'food') - usedOf(t, 'food');
  if (bt && left >= 0 && remDays && num(t.budget.food)) alert += `<div class="alert good mt">🍜 ค่าอาหารเหลือใช้ได้วันละ ${money(Math.max(0, foodLeft) / remDays)} (อีก ${remDays} วัน)</div>`;

    <div><b class="num" style="color:${left < 0 ? 'var(--bad)' : 'var(--good)'}">${money(left)}</b><span>คงเหลือ</span></div></div>
    ${bt ? `<div class="bar ${barCls(pct(u, bt))} mt"><i style="width:${Math.min(100, pct(u, bt))}%"></i></div>` : ''}${alert}</div>`;
  if (ab) h += `<div class="card flat"><div class="rate"><span class="grow">💱 1 ${t.currency} = <b class="num">${fmtRate(t.rate)}</b> บาท
    <span class="muted small">${t.rateAt ? '· ' + ago(t.rateAt) : '· ใส่เอง'}</span></span><button class="btn ghost sm" data-act="editRate">แก้เรท</button></div>
    <div class="row mt-s"><input id="qc" type="number" inputmode="decimal" step="any" placeholder="แปลงด่วน: จำนวน ${t.currency}" class="num" style="min-height:40px"><b class="num" id="qcOut" style="min-width:90px;text-align:right">= ฿0</b></div></div>`;
  h += `<div class="card"><div class="ch"><h2>งบตามหมวด</h2><button class="btn ghost sm" data-act="editBudget">ตั้งงบ</button></div>
    ${Object.entries(BCATS).map(([k, c]) => { const b = budgetOf(t, k), us = usedOf(t, k), p = pct(us, b);
      return `<div class="bc"><span class="ic">${c.i}</span><span>${c.n}${c.perDay && num(t.budget.food) ? ` <span class="muted small">(${money(t.budget.food)}/วัน)</span>` : ''}</span>
      <span class="num small right">${money(us)} <span class="muted">/ ${b ? money(b) : '–'}</span></span>
      <div class="bar ${b ? barCls(p) : ''}"><i style="width:${b ? Math.min(100, p) : 0}%"></i></div></div>`; }).join('')}</div>`;
  if (t.members.length > 1) { const tx = settle(t);
    h += `<div class="card"><div class="ch"><h2>🤝 หารเงิน ${t.members.length} คน</h2><button class="btn ghost sm" data-act="go" data-v="split">ดูทั้งหมด</button></div>
      ${tx.length ? tx.slice(0, 3).map(x => `<div class="row small" style="padding:4px 0">${esc(mName(t, x.from))} → ${esc(mName(t, x.to))}<span class="grow"></span><b class="num">${money(x.amt)}</b></div>`).join('') + (tx.length > 3 ? `<div class="muted small">และอีก ${tx.length - 3} รายการ</div>` : '')
        : '<div class="muted small">ตอนนี้ไม่มีใครต้องโอนให้ใคร</div>'}</div>`; }
  h += `<div class="row" style="margin:16px 2px 8px"><h2 class="grow">รายจ่าย (${t.expenses.length})</h2></div>
    <div class="seg" style="margin-bottom:10px"><button class="${ui.expMode !== 'cal' ? 'on' : ''}" data-act="expMode" data-m="list">📋 รายการ</button><button class="${ui.expMode === 'cal' ? 'on' : ''}" data-act="expMode" data-m="cal">🗓️ ปฏิทิน</button></div>`;
  if (ui.expMode === 'cal') return h + calendarHtml(t) + `<button class="fab" data-act="addExp" aria-label="บันทึกรายจ่าย">＋</button>`;
  h += `
    <div class="scrollx"><div class="chips"><button class="chip ${!ui.expCat ? 'on' : ''}" data-act="expCat" data-k="">ทั้งหมด</button>
    ${Object.entries(BCATS).map(([k, c]) => `<button class="chip ${ui.expCat === k ? 'on' : ''}" data-act="expCat" data-k="${k}">${c.i} ${c.n.split(' ')[0]}</button>`).join('')}</div></div>`;
  const list = t.expenses.filter(e => !ui.expCat || e.cat === ui.expCat);

  const byDay = {}; list.forEach(e => (byDay[e.day] = byDay[e.day] || []).push(e));
  Object.keys(byDay).sort((a, b) => a - b).forEach(d => {

}
function expRow(t, e){
  const who = t.members.length > 1 ? `${mName(t, e.paidBy)} จ่าย${e.splitAmong.length < t.members.length ? ' · หาร ' + e.splitAmong.length + ' คน' : ''}` : '';
  const sub = [who, e.note].filter(Boolean).join(' · ') + (e.receipts.length ? ' 📎' + e.receipts.length : '');
  return `<button class="ex" data-act="editExp" data-id="${e.id}"><span class="ic">${BCATS[e.cat].i}</span>
    <span class="grow"><span class="nm">${esc(e.name)}</span>${sub ? `<span class="muted small" style="display:block">${esc(sub)}</span>` : ''}</span>
    <span class="right"><b class="num">${money(expThb(e))}</b>${e.curr !== 'THB' ? `<span class="muted small num" style="display:block">${money(e.amount, e.curr)}</span>` : ''}</span></button>`;
}
function calendarHtml(t){
  const byDay = {}; t.expenses.forEach(e => byDay[e.day] = (byDay[e.day] || 0) + expThb(e));
  const sel = ui.calDay, short = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : Math.round(n);
  let h = '';
  if (!t.startDate) {
    h += `<div class="alert info" style="margin-bottom:10px">ใส่วันเดินทางในหน้าแก้ไขทริป จะเห็นเป็นปฏิทินจริง <button class="link" data-act="editTrip">ใส่วัน</button></div><div class="cal">`;
    for (let i = 1; i <= days(t); i++) h += `<button class="cd in ${sel === i ? 'sel' : ''}" data-act="calDay" data-d="${i}"><span>วัน ${i}</span>${byDay[i] ? `<b>${short(byDay[i])}</b>` : ''}</button>`;
    h += '</div>';
  } else {
    const s = new Date(t.startDate + 'T00:00'), en = new Date(endDate(t) + 'T00:00'), today = todayIso();
    let m = new Date(s.getFullYear(), s.getMonth(), 1);
    while (m <= en) {
      h += `<div class="card"><div class="ch"><h2>${m.toLocaleDateString('th-TH', {month:'long', year:'numeric'})}</h2></div><div class="cal">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x => `<div class="dow">${x}</div>`).join('')}`;
      for (let i = 0; i < m.getDay(); i++) h += '<div></div>';
      const last = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      for (let k = 1; k <= last; k++) {
        const dt = new Date(m.getFullYear(), m.getMonth(), k), idx = Math.round((dt - s) / 864e5) + 1, isT = iso(dt) === today;
        if (dt >= s && dt <= en) h += `<button class="cd in ${sel === idx ? 'sel' : ''} ${isT ? 'today' : ''}" data-act="calDay" data-d="${idx}" aria-label="วันที่ ${idx}"><span>${k}</span>${byDay[idx] ? `<b>${short(byDay[idx])}</b>` : ''}</button>`;
        else h += `<div class="cd"><span>${k}</span></div>`;
      }
      h += '</div></div>'; m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }
  }
  const pre = byDay[0] || 0;
  h += `<button class="ex mt" data-act="calDay" data-d="0" style="${sel === 0 ? 'border-color:var(--acc)' : ''}"><span class="ic">🧳</span><span class="grow nm">ก่อนเดินทาง</span><b class="num">${money(pre)}</b></button>`;
  const out = t.expenses.filter(e => e.day > days(t)).length;
  if (out) h += `<div class="alert warn mt">มี ${out} รายการอยู่นอกช่วงวันเดินทาง</div>`;
  if (sel === null || sel === undefined) return h + `<div class="muted small mt">แตะวันที่เพื่อดูรายการของวันนั้น</div>`;
  const list = t.expenses.filter(e => e.day === sel), dd = dayDate(t, sel);
  h += `<div class="dayhd"><span>${sel === 0 ? 'ก่อนเดินทาง' : 'วันที่ ' + sel + (dd ? ' · ' + thDate(dd) : '')}</span><span class="num">${money(list.reduce((a, e) => a + expThb(e), 0))}</span></div>`;
  return h + (list.length ? list.map(e => expRow(t, e)).join('') : `<div class="empty" style="padding:20px">ไม่มีรายจ่ายวันนี้</div>`);
}

/* ============ VIEW: COMPARE ============ */

    ['<b>รวม ใช้/งบ</b>', x => `<b>${money(x.used)}</b><span class="muted"> / ${money(x.bt)}</span>`], ['ต่อคน', x => money(x.base / x.p)],
    ['เตรียมของ', x => `${x.t.packing.filter(p => p.checked).length}/${x.t.packing.length}`], ['จ่ายมากสุด', x => top(x.t)]];

function renderThumbs(){ const el = $('#eThumbs'); if (!el || !S) return;
  el.innerHTML = S.receipts.map(id => `<div class="th"><img data-rid="${id}" data-act="lb" alt="ใบเสร็จ"><button data-act="delR" data-id="${id}" aria-label="ลบรูป">✕</button></div>`).join(''); hydrate(el); }
function expPreview(){
  const t = cur(), el = $('#ePrev'); if (!el || !S) return;
  const a = num($('#eAmt').value);

}

const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function tripMonths(t){
  if (!t.startDate) return null;
  const out = [], d = new Date(t.startDate + 'T00:00'), e = new Date(endDate(t) + 'T00:00');
  while (d <= e) { const m = d.getMonth() + 1; if (!out.includes(m)) out.push(m); d.setDate(d.getDate() + 1); }
  return out;
}
function seasonsFor(t, months){ return (SEASONS[t.country] || []).filter(x => x.m.some(m => months.includes(m))); }
function seasonMissing(t, list){
  const have = new Set(t.packing.map(p => p.name.trim())), out = [];
  list.forEach(x => x.pack.forEach(([n, c]) => { if (!have.has(n) && !out.some(o => o[0] === n)) out.push([n, c]); }));
  return out;
}

  h += list.map(x => `<div class="fact"><span class="ic">${x.i}</span><b>${esc(x.t)} <span class="muted small num" style="font-weight:500">${esc(x.temp)}</span></b><span class="small" style="color:var(--ink2)">${esc(x.d)}</span></div>`).join('');
  if (miss.length) h += `<div class="alert info mt"><b>ของที่ควรพกช่วงนี้</b><div class="chips mt-s">${miss.map(([n]) => `<span class="tag">${esc(n)}</span>`).join('')}</div>

    ${all.map(x => `<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--line);align-items:flex-start"><span style="width:96px;flex-shrink:0;color:var(--ink3)">${mLabel(x.m)}</span><span class="grow">${x.i} ${esc(x.t)} <span class="muted num">${esc(x.temp)}</span></span></div>`).join('')}</details>
    <div class="muted small mt-s">ค่าเฉลี่ยโดยประมาณ ประเทศใหญ่ใช้เมืองหลักเป็นตัวอย่าง เช็กพยากรณ์อากาศจริงก่อนเดินทาง 3–5 วัน</div></div>`;

/* ============ REMINDERS ============ */
function addDays(s, n){ const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return iso(d); }
function reminders(t){
  if (!t.startDate) return [];
  const s = t.startDate, out = [], e = ENTRY[t.country], ab = isAbroad(t);
  const add = (id, date, text, url) => out.push({id, date, text, url:url || '', done:!!t.remDone[id]});
  if (ab && e) e.forms.forEach((f, i) => {
    if (t.tipsDone['entry_' + t.country + '_' + i]) return;
    if (f.w) add('f' + i, addDays(s, -f.w), `กรอก ${f.n} (กรอกได้ ${f.w} วันก่อนถึง)`, f.u);
    else if (f.lead) add('f' + i, addDays(s, -f.lead), `ยื่น ${f.n} (ควรยื่นล่วงหน้าอย่างน้อย ${f.lead} วัน)`, f.u);
  });
  t.packing.filter(p => p.buy && !p.checked).forEach(p => add('buy_' + p.id, addDays(s, -7), `ซื้อ ${p.name}`));
  if (ab) { add('checkin', addDays(s, -2), 'เช็กอินออนไลน์ (เปิด 24–48 ชม. ก่อนบิน)'); if (t.currency && t.currency !== 'THB') add('cash', addDays(s, -3), `แลกเงิน ${t.currency} ติดตัวบางส่วน`); }
  if (!t.sos.hotelAddr) add('sos', addDays(s, -3), 'กรอกการ์ดฉุกเฉิน: ที่อยู่ที่พัก เบอร์ติดต่อ ประกัน');
  const left = t.packing.filter(p => !p.checked).length;
  if (left) add('pack', addDays(s, -1), `แพ็กของให้ครบ (เหลือ ${left} รายการ)`);
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
const remState = r => { const td = todayIso(); return r.done ? 'done' : r.date < td ? 'late' : r.date === td ? 'today' : 'soon'; };
function gcalUrl(t, r){
  const d1 = r.date.replace(/-/g, ''), d2 = addDays(r.date, 1).replace(/-/g, '');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('✈️ ' + r.text) + '&dates=' + d1 + '/' + d2 +
    '&details=' + encodeURIComponent('ทริป: ' + (t.name || '') + (r.url ? '\n' + r.url : '') + '\n(จาก TripBudget)');
}
function remindersHtml(t, compact){
  if (!t.startDate) return compact ? '' : `<div class="card"><div class="ch"><h2>🔔 สิ่งที่ต้องทำ</h2></div><div class="muted small">ใส่วันเดินทางในหน้าแก้ไขทริป แอปจะบอกว่าต้องทำอะไรวันไหน <button class="link" data-act="editTrip">ใส่วัน</button></div></div>`;
  const all = reminders(t), open = all.filter(r => !r.done), soonLimit = addDays(todayIso(), 3);
  const list = compact ? open.filter(r => r.date <= soonLimit).slice(0, 3) : open;
  if (compact && !list.length) return '';
  const label = r => { const s = remState(r); return s === 'late' ? `เลยกำหนด · ${thDate(r.date)}` : s === 'today' ? 'วันนี้' : thDate(r.date); };
  const canNotify = 'Notification' in window && Notification.permission === 'default';
  return `<div class="card"><div class="ch"><h2>🔔 สิ่งที่ต้องทำ</h2>${compact ? `<button class="btn ghost sm" data-act="go" data-v="plan">ดูทั้งหมด</button>` : `<span class="muted small num">${all.length - open.length}/${all.length}</span>`}</div>
    ${list.length ? list.map(r => `<div class="rem ${remState(r)}"><button class="ck" data-act="remDone" data-id="${r.id}" aria-label="ทำแล้ว">✓</button>
      <div class="grow"><b>${esc(r.text)}</b><div class="muted small">${label(r)}</div></div>
      ${r.url ? `<a class="btn ghost sm" href="${r.url}" target="_blank" rel="noopener" style="text-decoration:none" aria-label="เปิดเว็บ">↗</a>` : ''}
      ${compact ? '' : `<a class="btn ghost sm" href="${gcalUrl(t, r)}" target="_blank" rel="noopener" style="text-decoration:none" aria-label="ใส่ปฏิทิน">📅</a>`}</div>`).join('')
      : `<div class="alert good">✅ ทำครบแล้ว</div>`}
    ${!compact ? `<div class="muted small mt-s">กด 📅 เพื่อใส่ใน Google Calendar จะได้แจ้งเตือนแม้ไม่ได้เปิดแอป${canNotify ? ' · <button class="link" data-act="askNotify">เปิดแจ้งเตือนเมื่อเปิดแอป</button>' : ''}</div>` : ''}</div>`;
}
async function notifyDue(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const td = todayIso(); db.notified = db.notified || {}; let n = 0;
  let reg = null; try { reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); } catch {}
  for (const t of db.trips) for (const r of reminders(t)) {
    if (r.done || r.date > td || n >= 3) continue; const k = t.id + ':' + r.id; if (db.notified[k] === td) continue;
    db.notified[k] = td; n++;
    try { if (reg) reg.showNotification(t.name || 'TripBudget', {body:r.text, icon:'icon-192.png', tag:k}); else new Notification(t.name || 'TripBudget', {body:r.text}); } catch {}
  }
  if (n) save();
}

/* ============ RECEIPT SCAN (OCR) ============ */
let ocrWorker = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function ocrText(img){
  if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if (!ocrWorker) ocrWorker = await Tesseract.createWorker('eng');
  const r = await ocrWorker.recognize(img); return (r && r.data && r.data.text) || '';
}
function parseAmount(raw, zero){
  let s = raw.replace(/\s/g, '');
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) return +s.replace(/[.,]/g, '');
  const m = s.match(/^(\d{1,3}(?:[.,]\d{3})*|\d+)[.,](\d{1,2})$/);
  if (m) return +(m[1].replace(/[.,]/g, '') + '.' + m[2]);
  return +s.replace(/[.,]/g, '');
}
function amountsFrom(text, curr){
  const zero = ZERO_DEC.has(curr), KW = /(total|grand|amount|due|sum|balance|合計|合计|总计|小計|計|합계|결제|tổng|jumlah|รวม|ยอด)/i, NEG = /(change|cash|tax|vat|tel|phone|no\.|#|お釣|釣銭|おつり|税)/i;
  const out = [];
  text.split(/\n/).forEach(ln => {
    ln = ln.replace(/\+?\d{1,4}[-\/.\s]\d{2,4}[-\/.\s]\d{2,4}(?:[-\/.\s]\d{1,4})?/g, m => /^\d{1,3}([.,]\d{3})+([.,]\d{1,2})?$/.test(m.trim()) ? m : ' ');
    const nums = ln.match(/\d{1,3}(?:[.,\s]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?/g) || [];
    nums.forEach(raw => { const v = parseAmount(raw, zero); if (!(v > 0) || v > 1e8) return;
      if (/^\d{8,}$/.test(raw.replace(/\D/g, ''))) return;
      if (!KW.test(ln) && v >= 1990 && v <= 2099 && !/[.,]/.test(raw)) return;
      out.push({v, score:(KW.test(ln) ? 2 : 0) - (NEG.test(ln) ? 1 : 0)}); });
  });
  out.sort((a, b) => b.score - a.score || b.v - a.v);
  const seen = new Set(), res = []; for (const x of out) { if (seen.has(x.v)) continue; seen.add(x.v); res.push(x.v); if (res.length >= 4) break; }
  return res;
}

/* ============ SHARE TRIP ============ */
async function collectFiles(trips){
  const files = {};
  for (const t of trips) {
    const ids = [...t.expenses.flatMap(e => e.receipts), ...(t.docs || []).flatMap(d => d.files.map(f => f.id))];
    for (const id of ids) { try { const v = await IDB.get(id); if (v) files[id] = v; } catch {} }
  }
  return files;
}
async function shareTrip(){
  const t = cur(); if (!t) return;
  const r = await dialog({title:'แชร์ทริปนี้ให้เพื่อน', text:'ได้ไฟล์ .json ส่งทาง LINE หรือแอปอื่น เพื่อนกด ⋮ → กู้คืนข้อมูล แล้วเลือกไฟล์นี้ในแอป TripBudget',
    body:`<label class="tog" style="margin-bottom:6px"><input type="checkbox" name="files">รวมรูปใบเสร็จ ตั๋ว และใบจอง (ไฟล์จะใหญ่ขึ้น)</label>
    <label class="tog"><input type="checkbox" name="sos">รวมข้อมูลการ์ดฉุกเฉินของทริป (ที่พัก ประกัน)</label>`, ok:'แชร์'});
  if (!r) return;
  const copy = clone(t); if (!r.sos) copy.sos = {};
  if (!r.files) { copy.expenses.forEach(e => e.receipts = []); copy.docs = []; }
  const data = {app:'TripBudget', version:4, kind:'trip', exportedAt:new Date().toISOString(), trips:[copy], receipts:r.files ? await collectFiles([copy]) : {}};
  const name = 'tripbudget-' + (t.name || 'trip').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 40) + '.json';
  const file = new File([JSON.stringify(data)], name, {type:'application/json'});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:t.name || 'ทริป', text:'ทริปจาก TripBudget'}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  download(name, JSON.stringify(data), 'application/json'); toast('บันทึกไฟล์แล้ว ส่งให้เพื่อนได้เลย');
}

async function importData(file){
  let d; try { d = JSON.parse(await file.text()); } catch { toast('อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์ .json จากแอปนี้', 'bad'); return; }
  const arr = d && Array.isArray(d.trips) ? d.trips : null;
  if (!arr) { toast('ไม่พบข้อมูลทริปในไฟล์นี้', 'bad'); return; }
  const isV3 = arr.some(t => t.flight || t.hotels);
  if (d.kind === 'trip' && !isV3) {
    const t0 = arr[0], exists = db.trips.some(x => x.id === t0.id);
    const r1 = await dialog({title:`นำเข้าทริป "${t0.name || 'ทริป'}"?`, text:exists ? 'มีทริปนี้ในเครื่องอยู่แล้ว เลือกว่าจะทำอย่างไร' : 'ทริปจะถูกเพิ่มเข้าในรายการทริปของคุณ',
      body:exists ? `<label class="f">ทำอย่างไร<select name="mode"><option value="copy">เพิ่มเป็นทริปใหม่ (เก็บของเดิมไว้)</option><option value="replace">แทนที่ทริปเดิม</option></select></label>` : '', ok:'นำเข้า'});
    if (!r1) return;
    for (const [id, v] of Object.entries(d.receipts || {})) { try { await IDB.put(id, v); } catch {} }
    const t = normalizeTrip(clone(t0));
    if (exists && r1.mode !== 'replace') { t.id = uid(); t.name = (t.name || 'ทริป') + ' (จากเพื่อน)'; db.trips.push(t); }
    else { const i = db.trips.findIndex(x => x.id === t.id); if (i >= 0) db.trips[i] = t; else db.trips.push(t); }
    db.currentId = t.id; save(); go('packing'); toast('นำเข้าทริปแล้ว'); return;
  }
  const r = await dialog({title:`กู้คืน ${arr.length} ทริป?`, text:'ทริปที่มีอยู่แล้ว (ID เดียวกัน) จะถูกแทนที่ด้วยข้อมูลในไฟล์' + (d.templates && !isV3 ? '\nเทมเพลตเตรียมของจะถูกแทนที่ด้วย' : ''), ok:'กู้คืน'});
  if (!r) return;
  for (const [id, v] of Object.entries(d.receipts || {})) { try { await IDB.put(id, v); } catch {} }
  const trips = arr.map(t => isV3 ? fromV3(t) : normalizeTrip(t));
  for (const t of trips) { const i = db.trips.findIndex(x => x.id === t.id); if (i >= 0) db.trips[i] = t; else db.trips.push(t); }
  if (d.templates && !isV3) db.templates = d.templates;
  if (!db.currentId && trips[0]) db.currentId = trips[0].id;
  save(); go('trips'); toast(`กู้คืน ${trips.length} ทริปแล้ว`);
}

  toggleTip(el){ const t = cur(), id = el.dataset.id; if (t.tipsDone[id]) delete t.tipsDone[id]; else t.tipsDone[id] = true; save(); render(); },
  tplGroup(el){ ui.tplGroup = el.dataset.k; render(); },
  addTpl(){ (db.templates[ui.tplGroup] = db.templates[ui.tplGroup] || []).push({id:uid(), name:'ของใหม่', cat:'other', qty:1, perDay:false, buy:'', key:''}); save(); render();
    const ins = $$('#tplList [data-tf="name"]'); const last = ins[ins.length - 1]; if (last) { last.focus(); last.select(); } },
  delTpl(el){ db.templates[ui.tplGroup] = db.templates[ui.tplGroup].filter(x => x.id !== el.dataset.id); save(); render(); },
  async resetTpl(el){ const k = el.dataset.k;
    if (!await dialog({title:k === 'all' ? 'รีเซ็ตเทมเพลตทั้งหมด?' : `รีเซ็ตกลุ่ม "${TPL_GROUPS[k]}"?`, text:'ของที่แก้หรือเพิ่มเองในเทมเพลตจะหายไป ลิสต์ในทริปที่สร้างแล้วไม่เปลี่ยน', ok:'รีเซ็ต', danger:true})) return;
    const d = tplWithIds(DEFAULT_TPL()); if (k === 'all') db.templates = d; else db.templates[k] = d[k]; save(); render(); toast('รีเซ็ตแล้ว'); },
  exportData(){ closeMenu(); exportData(); },
  importData(){ closeMenu(); $('#importFile').click(); },
  seasonMonth(el){ ui.seasonMonth = +el.dataset.m; render(); },
  addSeasonPack(){ const t = cur(), tm = tripMonths(t) || [ui.seasonMonth || (new Date().getMonth() + 1)], miss = seasonMissing(t, seasonsFor(t, tm));
    miss.forEach(([name, cat]) => t.packing.push({id:uid(), name, cat:PACK_CATS[cat] ? cat : 'other', qty:1, perDay:false, buy:'', key:'', checked:false, expId:''}));
    save(); render(); toast(`เพิ่ม ${miss.length} รายการเข้าลิสต์เตรียมของแล้ว`); },
  remDone(el){ const t = cur(); t.remDone[el.dataset.id] = true; save(); render(); toast('ทำแล้ว ✓'); },
  async askNotify(){ try { const r = await Notification.requestPermission(); if (r === 'granted') { toast('เปิดแจ้งเตือนแล้ว'); notifyDue(); } else toast('ไม่ได้เปิดแจ้งเตือน', 'warn'); } catch {} render(); },
  addPlan(el){ planSheet(cur(), null, +el.dataset.d || 1); },
  editPlan(el){ const t = cur(), x = t.plan.find(p => p.id === el.dataset.id); if (x) planSheet(t, x); },
  savePlan(){ const t = cur(), title = $('#pTitle').value.trim(); if (!title) { toast('ใส่ว่าจะทำอะไรก่อน', 'bad'); $('#pTitle').focus(); return; }
    const v = {day:+$('#pDay').value || 1, time:$('#pTime').value, title, place:$('#pPlace').value.trim(), note:$('#pNote').value.trim()};
    const edit = !!S.id; if (edit) Object.assign(t.plan.find(p => p.id === S.id), v); else t.plan.push({id:uid(), ...v});
    save(); closeSheet(); render(); toast(edit ? 'แก้ไขแล้ว' : 'เพิ่มแผนแล้ว'); },
  async delPlan(){ const t = cur(); t.plan = t.plan.filter(p => p.id !== S.id); save(); closeSheet(); render(); toast('ลบแล้ว', 'warn'); },
  addDoc(){ docSheet(cur(), null); },
  editDoc(el){ const t = cur(), d = t.docs.find(x => x.id === el.dataset.id); if (d) docSheet(t, d); },
  delDocFile(el){ const id = el.dataset.id; S.files = S.files.filter(f => f.id !== id);
    if (S.added.includes(id)) { S.added = S.added.filter(x => x !== id); IDB.del(id); } else S.removed.push(id); renderDocFiles(); },
  saveDoc(){ const t = cur(), kind = $('#dKind').value, title = $('#dTitle').value.trim() || DOC_KINDS[kind].replace(/^\S+\s/, '');
    const v = {title, kind, files:S.files}; const edit = !!S.id;
    if (edit) Object.assign(t.docs.find(x => x.id === S.id), v); else t.docs.push({id:uid(), ...v});
    S.removed.forEach(id => IDB.del(id)); S.added = []; save(); closeSheet(); render(); toast(edit ? 'แก้ไขแล้ว' : 'เก็บเอกสารแล้ว'); },
  async delDoc(){ const t = cur(), d = t.docs.find(x => x.id === S.id); if (!d) return;
    if (!await dialog({title:`ลบ "${d.title}"?`, text:'ไฟล์ที่แนบไว้จะถูกลบด้วย', ok:'ลบ', danger:true})) return;
    [...d.files.map(f => f.id), ...S.added].forEach(id => IDB.del(id)); S.added = []; t.docs = t.docs.filter(x => x !== d); save(); closeSheet(); render(); toast('ลบแล้ว', 'warn'); },
  openFile(el){ openFile(el.dataset.id); },
  editSos(){ sosSheet(); },
  saveSos(){ const p = db.profile, v = id => ($('#' + id) || {}).value || '';
    Object.assign(p, {name:v('sName').trim(), blood:v('sBlood').trim(), meds:v('sMeds').trim(), allergies:v('sAllergy').trim()});
    p.contacts = p.contacts.map((c, i) => ({name:v('sCn' + i).trim(), phone:v('sCp' + i).trim()}));
    const t = cur(); if (t) Object.assign(t.sos, {hotel:v('sHotel').trim(), hotelAddr:v('sAddr').trim(), hotelPhone:v('sHotelTel').trim(), insurer:v('sIns').trim(), policy:v('sPolicy').trim(), insPhone:v('sInsTel').trim(), embassy:v('sEmb').trim(), note:v('sNote').trim()});
    save(); closeSheet(); render(); toast('บันทึกการ์ดฉุกเฉินแล้ว'); },
  bigText(el){ showBig(el.dataset.k); },
  closeBig(){ $('#big').hidden = true; },
  shareTrip(){ closeMenu(); shareTrip(); },
  scanPick(el){ $('#eAmt').value = el.dataset.v; expPreview(); $$('#scanOut .chip').forEach(c => c.classList.toggle('on', c === el)); },
  async install(){ closeMenu(); if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#installBtn').hidden = true; }
};

/* ============ EVENTS ============ */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  if (e.target.id === 'dlgFetch') { (async () => { const b = e.target; b.textContent = '⏳ กำลังดึง...'; const t = cur();
    if (await fetchRates() && liveRate(t.currency)) { const i = $('#dlg [name="rate"]'); i.value = rateVal(liveRate(t.currency)); dlgFetched = num(i.value); b.textContent = '✓ ได้เรทล่าสุดแล้ว'; }
    else { b.textContent = 'ดึงไม่ได้ ลองใหม่หรือพิมพ์เอง'; } })(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || (!el.closest('#menu') && el.dataset.act !== 'menu')) closeMenu();
  if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.stopPropagation(); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.fm !== undefined && ui.form) { const m = ui.form.members[+el.dataset.fm]; if (m) m.name = el.value; return; }
  if (el.dataset.ff && ui.form) {
    const f = ui.form, k = el.dataset.ff; f[k] = el.value;
    if (k === 'days') f.days = el.value;
    if (k === 'rate') { f.rate = num(el.value); f.rateAt = ''; const n = $('#fRateNote'); if (n) n.innerHTML = '<span class="dot off"></span>ใส่เรทเอง'; }
    if (k === 'country') { const c = COUNTRIES[f.country];
      if (f.country === 'TH') { f.currency = 'THB'; f.rate = 1; if (f.type === 'abroad') f.type = 'leisure'; }
      else { f.currency = c.c || ''; f.rate = f.currency ? anyRate(f.currency) : 0; f.rateAt = ''; }
      render(); if (f.currency && f.currency !== 'THB') formFetchRate(false); }
    if (k === 'currency') { f.rate = anyRate(f.currency); f.rateAt = ''; render(); formFetchRate(false); }
    return;
  }
  if (el.dataset.tf) {
    const it = (db.templates[ui.tplGroup] || []).find(x => x.id === el.closest('[data-tid]').dataset.tid); if (!it) return;
    const k = el.dataset.tf; it[k] = k === 'qty' ? Math.max(0, num(el.value)) : k === 'perDay' ? el.checked : k === 'buy' ? (el.checked ? (it.buy || 'other') : '') : el.value;
    saveSoon(); return;
  }
  if (el.dataset.bk) { const t = cur(); let s = 0; $$('[data-bk]').forEach(i => s += i.dataset.bk === 'food' ? num(i.value) * days(t) : num(i.value)); $('#bTot').textContent = money(s); return; }
  if (el.id === 'eAmt' || el.id === 'eRate') { expPreview(); return; }
  if (el.id === 'qc') { const t = cur(); $('#qcOut').textContent = '= ' + money(num(el.value) * t.rate); return; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'scanFile' && el.files[0] && S) {
    const file = el.files[0]; el.value = ''; const out = $('#scanOut');
    if (!navigator.onLine) { toast('การสแกนต้องใช้อินเทอร์เน็ต', 'warn'); return; }
    out.innerHTML = '<span class="muted small">⏳ กำลังอ่านใบเสร็จ... (ครั้งแรกอาจใช้เวลาสักพัก)</span>';
    try {
      const v = await compress(file, 1600, .85);
      const id = uid(); await IDB.put(id, v); thumbs.set(id, v); if (S) { S.receipts.push(id); S.added.push(id); renderThumbs(); }
      const text = await ocrText(v); if (!S || !$('#scanOut')) return;
      const nums = amountsFrom(text, S.curr);
      $('#scanOut').innerHTML = nums.length ? '<span class="muted small" style="width:100%">แตะยอดที่ถูกต้อง:</span>' + nums.map((n, i) => `<button class="chip ${i === 0 ? 'on' : ''}" data-act="scanPick" data-v="${n}">${fmt(n, 2)}</button>`).join('') : '<span class="muted small">อ่านยอดไม่ได้ ลองถ่ายให้ชัดขึ้น หรือพิมพ์เอง</span>';
      if (nums.length && !num($('#eAmt').value)) { $('#eAmt').value = nums[0]; expPreview(); }
    } catch { const o = $('#scanOut'); if (o) o.innerHTML = '<span class="muted small">สแกนไม่สำเร็จ ลองใหม่หรือพิมพ์ยอดเอง</span>'; }
    return;
  }
  if (el.id === 'dFile' && el.files.length && S) {
    for (const file of [...el.files]) { try {
      const isPdf = file.type === 'application/pdf';
      if (isPdf && file.size > 15e6) { toast('PDF ใหญ่เกิน 15MB', 'bad'); continue; }
      const v = isPdf ? await readDataUrl(file) : await compress(file, 2000, .88); const id = uid(); await IDB.put(id, v); thumbs.set(id, v);
      if (!S) { IDB.del(id); return; } S.files.push({id, type:isPdf ? 'pdf' : 'image', name:file.name}); S.added.push(id);
    } catch { toast('เพิ่มไฟล์ไม่สำเร็จ', 'bad'); } }
    el.value = ''; renderDocFiles(); return;
  }
  if (el.id === 'eFile' && el.files.length && S) {
    for (const file of [...el.files]) { try { const v = await compress(file); const id = uid(); await IDB.put(id, v); thumbs.set(id, v); if (!S) { IDB.del(id); return; } S.receipts.push(id); S.added.push(id); } catch { toast('แนบรูปไม่สำเร็จ', 'bad'); } }
    el.value = ''; renderThumbs(); return;
  }
  if (el.id === 'importFile' && el.files[0]) { importData(el.files[0]); el.value = ''; return; }
  if (el.dataset.tf === 'cat') { const it = db.templates[ui.tplGroup].find(x => x.id === el.closest('[data-tid]').dataset.tid); if (it) { it.cat = el.value; save(); } }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#big').hidden) { $('#big').hidden = true; return; }
  if (!$('#lb').hidden) { $('#lb').hidden = true; return; }
  if (!$('#dlg').hidden) return;
  if (S) closeSheet(); closeMenu();
});
const setOnline = () => { $('#offline').hidden = navigator.onLine; };
window.addEventListener('online', () => { setOnline(); if (!ratesFresh()) fetchRates(); });
window.addEventListener('offline', setOnline);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('ติดตั้งแล้ว'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

/* ============ BOOT ============ */
(function boot(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.trips)) db = d; } catch {}
  try { const r = JSON.parse(localStorage.getItem(RKEY)); if (r && r.rates) rates = {rates:r.rates, at:r.at || r.updated || null}; } catch {}
  if (!db.templates) db.templates = tplWithIds(DEFAULT_TPL());
  db.profile = Object.assign({name:'', blood:'', allergies:'', meds:'', contacts:[{name:'', phone:''}, {name:'', phone:''}]}, db.profile || {});
  if (!Array.isArray(db.profile.contacts) || !db.profile.contacts.length) db.profile.contacts = [{name:'', phone:''}, {name:'', phone:''}];
  let migrated = 0;
  if (!localStorage.getItem(KEY)) {
    try { const old = JSON.parse(localStorage.getItem(V3KEY)); if (old && Array.isArray(old.trips) && old.trips.length) {
      db.trips = old.trips.map(fromV3); db.currentId = old.currentId && db.trips.some(t => t.id === old.currentId) ? old.currentId : (db.trips[0] || {}).id || null; migrated = db.trips.length; } } catch {}
  }
  db.trips = db.trips.map(normalizeTrip);
  if (db.currentId && !cur()) db.currentId = null;
  save();
  ui.view = db.currentId ? 'packing' : 'trips';
  render(); setOnline(); setTimeout(notifyDue, 1500);
  if (migrated) setTimeout(() => dialog({title:`ย้ายข้อมูลเดิม ${migrated} ทริปแล้ว`, text:'รายจ่าย ตั๋ว และที่พักเดิมอยู่ในหน้างบประมาณ งบรวมเดิมใส่ไว้ในหมวด "อื่นๆ" ปรับแยกหมวดได้ที่ปุ่ม "ตั้งงบ"\nแนะนำกดสำรองข้อมูลเก็บไว้หนึ่งครั้ง', ok:'เข้าใจแล้ว', cancel:''}), 300);
  if (!ratesFresh()) fetchRates();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; save(); location.reload(); } });
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => { r.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
  }
})();
</script>
