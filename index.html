document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  if (e.target.id === 'dlgFetch') { (async () => { const b = e.target; b.textContent = '⏳ กำลังดึง...'; const t = cur();
    if (await fetchRates() && liveRate(t.currency)) { const i = $('#dlg [name="rate"]'); i.value = rateVal(liveRate(t.currency)); dlgFetched = num(i.value); b.textContent = '✓ ได้เรทล่าสุดแล้ว'; }
    else { b.textContent = 'ดึงไม่ได้ ลองใหม่หรือพิมพ์เอง'; } })(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || (!el.closest('#menu') && el.dataset.act !== 'menu')) closeMenu();
  if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.stopPropagation(); if (!/^(go|kp|menu|closeSheet|closeBig|closeLb|lb)$/.test(el.dataset.act)) track('a:' + el.dataset.act); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.qf) { const q = db.quick.find(x => x.id === el.closest('[data-qid]').dataset.qid); if (q) { q[el.dataset.qf] = el.dataset.qf === 'cat' ? el.value : el.value.trim() || (el.dataset.qf === 'icon' ? '🧾' : 'ปุ่ม'); saveSoon(); } return; }
  if (el.dataset.fm !== undefined && ui.form) { const m = ui.form.members[+el.dataset.fm]; if (m) m.name = el.value; return; }
  if (el.dataset.ff && ui.form) {
    const f = ui.form, k = el.dataset.ff; f[k] = el.value;
    if (k === 'days') f.days = el.value;
    if (k === 'rate') { f.rate = num(el.value); f.rateAt = ''; const n = $('#fRateNote'); if (n) n.innerHTML = '<span class="dot off"></span>ใส่เรทเอง'; }
    if (k === 'country') { const c = COUNTRIES[f.country];
      if (f.country === 'TH') { f.currency = 'THB'; f.rate = 1; if (f.type === 'abroad') f.type = 'leisure'; }
      else { f.currency = c.c || ''; f.rate = f.currency ? anyRate(f.currency) : 0; f.rateAt = ''; }
      render(); if (f.currency && f.currency !== 'THB') formFetchRate(false); }
    if (k === 'currency') { f.rate = anyRate(f.currency); f.rateAt = ''; render(); formFetchRate(false); }
    return;
  }
  if (el.dataset.tf) {
    const it = (db.templates[ui.tplGroup] || []).find(x => x.id === el.closest('[data-tid]').dataset.tid); if (!it) return;
    const k = el.dataset.tf; it[k] = k === 'qty' ? Math.max(0, num(el.value)) : k === 'perDay' ? el.checked : k === 'buy' ? (el.checked ? (it.buy || 'other') : '') : el.value;
    saveSoon(); return;
  }
  if (el.dataset.bk) { const t = cur(); let s = 0; $$('[data-bk]').forEach(i => s += i.dataset.bk === 'food' ? num(i.value) * days(t) : num(i.value)); $('#bTot').textContent = money(s); return; }
  if (el.id === 'eRate' && S) S.rateTouched = true;
  if (el.id === 'eAmt' || el.id === 'eRate') { expPreview(); return; }
  if (el.id === 'xThb' || el.id === 'xLocal') { xchPreview(); return; }
  if (el.id === 'qc') { const t = cur(); $('#qcOut').textContent = '= ' + money(num(el.value) * t.rate); return; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'avgTog') { db.settings.avgRate = el.checked;
    db.trips.forEach(t => { if (el.checked) applyAvgRate(t); else t.expenses.forEach(e => { if (isLocalCash(t, e) && !e.rateManual) e.rate = t.rate; }); });
    save(); render(); toast(el.checked ? 'ใช้เรตที่แลกจริงกับรายจ่ายเงินสดแล้ว' : 'กลับไปใช้เรตในแอปแล้ว'); return; }
  if (el.id === 'inboxTog') { db.settings.inbox = el.checked; save(); render(); toast(el.checked ? 'เปิดการเชื่อมกับแอปอื่นแล้ว' : 'ปิดการเชื่อมแล้ว'); return; }
  if (el.id === 'icName') { const t = cur(); t.ic.name = el.value; save(); return; }
  if (el.id === 'eTf' && el.checked) { toast('อย่าลืมเก็บใบเสร็จไว้กับของ และถ่ายรูปแนบไว้ 📷'); return; }
  if (el.id === 'usageTog') { db.settings.usage = el.checked; if (!el.checked) setUsage({days:{}}); save(); render(); toast(el.checked ? 'เปิดสถิติการใช้งานแล้ว' : 'ปิดและลบสถิติในเครื่องแล้ว'); return; }
  if (el.id === 'scanFile' && el.files[0] && S) {
    const file = el.files[0]; el.value = ''; const out = $('#scanOut');
    if (!navigator.onLine) { toast('การสแกนต้องใช้อินเทอร์เน็ต', 'warn'); return; }
    out.innerHTML = '<span class="muted small">⏳ กำลังอ่านใบเสร็จ... (ครั้งแรกอาจใช้เวลาสักพัก)</span>';
    try {
      const v = await compress(file, 1600, .85);
      const id = uid(); await IDB.put(id, v); thumbs.set(id, v); if (S) { S.receipts.push(id); S.added.push(id); renderThumbs(); }
      const text = await ocrText(v); if (!S || !$('#scanOut')) return;
      const nums = amountsFrom(text, S.curr);
      $('#scanOut').innerHTML = nums.length ? '<span class="muted small" style="width:100%">แตะยอดที่ถูกต้อง:</span>' + nums.map((n, i) => `<button class="chip ${i === 0 ? 'on' : ''}" data-act="scanPick" data-v="${n}">${fmt(n, 2)}</button>`).join('') : '<span class="muted small">อ่านยอดไม่ได้ ลองถ่ายให้ชัดขึ้น หรือพิมพ์เอง</span>';
      if (nums.length && !num($('#eAmt').value)) { $('#eAmt').value = nums[0]; expPreview(); }
    } catch { const o = $('#scanOut'); if (o) o.innerHTML = '<span class="muted small">สแกนไม่สำเร็จ ลองใหม่หรือพิมพ์ยอดเอง</span>'; }
    return;
  }
  if (el.id === 'dFile' && el.files.length && S) {
    for (const file of [...el.files]) { try {
      const isPdf = file.type === 'application/pdf';
      if (isPdf && file.size > 15e6) { toast('PDF ใหญ่เกิน 15MB', 'bad'); continue; }
      const v = isPdf ? await readDataUrl(file) : await compress(file, 2000, .88); const id = uid(); await IDB.put(id, v); thumbs.set(id, v);
      if (!S) { IDB.del(id); return; } S.files.push({id, type:isPdf ? 'pdf' : 'image', name:file.name}); S.added.push(id);
    } catch { toast('เพิ่มไฟล์ไม่สำเร็จ', 'bad'); } }
    el.value = ''; renderDocFiles(); return;
  }
  if (el.id === 'eFile' && el.files.length && S) {
    for (const file of [...el.files]) { try { const v = await compress(file); const id = uid(); await IDB.put(id, v); thumbs.set(id, v); if (!S) { IDB.del(id); return; } S.receipts.push(id); S.added.push(id); } catch { toast('แนบรูปไม่สำเร็จ', 'bad'); } }
    el.value = ''; renderThumbs(); return;
  }
  if (el.id === 'importFile' && el.files[0]) { importData(el.files[0]); el.value = ''; return; }
  if (el.dataset.tf === 'cat') { const it = db.templates[ui.tplGroup].find(x => x.id === el.closest('[data-tid]').dataset.tid); if (it) { it.cat = el.value; save(); } }
});
document.addEventListener('keydown', e => {
  if (S && S.kind === 'quick' && e.target.id !== 'qNote') { if (/^[0-9.]$/.test(e.key)) { kpPress(e.key); e.preventDefault(); return; } if (e.key === 'Backspace') { kpPress('⌫'); e.preventDefault(); return; } if (e.key === 'Enter' && num(S.val) > 0) { A.saveQuick(); return; } }
  if (e.key !== 'Escape') return;
  if (!$('#gate').hidden) return;
  if (!$('#onb').hidden) { A.onbDone(); return; }
  if (!$('#big').hidden) { $('#big').hidden = true; return; }
  if (!$('#lb').hidden) { $('#lb').hidden = true; return; }
  if (!$('#dlg').hidden) return;
  if (S) closeSheet(); closeMenu();
});
const setOnline = () => { $('#offline').hidden = navigator.onLine; };
window.addEventListener('online', () => { setOnline(); if (gateOn() && (!gate.access || gateLocked())) gateCheck(false); if (!ratesFresh()) fetchRates(); flushOutbox(); sendUsage(); });
window.addEventListener('offline', setOnline);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('ติดตั้งแล้ว'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else { importInbox(); if (gateOn() && (gateLocked() || Date.now() - (gate.at || 0) > 12 * 3600e3)) gateCheck(false); } });
window.addEventListener('storage', e => { if (e.key === INBOX_KEY && e.newValue) importInbox(); });
window.addEventListener('focus', () => importInbox());

/* ============ BOOT ============ */
(function boot(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.trips)) db = d; } catch {}
  try { const r = JSON.parse(localStorage.getItem(RKEY)); if (r && r.rates) rates = {rates:r.rates, at:r.at || r.updated || null}; } catch {}
  if (!db.templates) db.templates = tplWithIds(DEFAULT_TPL());
  db.quick = Array.isArray(db.quick) && db.quick.length ? db.quick : DEFAULT_QUICK();
  db.settings = Object.assign({usage:true}, db.settings || {});
  db.profile = Object.assign({job:'', workplace:'', name:'', blood:'', allergies:'', meds:'', contacts:[{name:'', phone:''}, {name:'', phone:''}]}, db.profile || {});
  if (!Array.isArray(db.profile.contacts) || !db.profile.contacts.length) db.profile.contacts = [{name:'', phone:''}, {name:'', phone:''}];
  let migrated = 0;
  if (!localStorage.getItem(KEY)) {
    try { const old = JSON.parse(localStorage.getItem(V3KEY)); if (old && Array.isArray(old.trips) && old.trips.length) {
      db.trips = old.trips.map(fromV3); db.currentId = old.currentId && db.trips.some(t => t.id === old.currentId) ? old.currentId : (db.trips[0] || {}).id || null; migrated = db.trips.length; } } catch {}
  }
  db.trips = db.trips.map(normalizeTrip);
  if (db.currentId && !cur()) db.currentId = null;
  save();
  ui.view = !db.currentId ? 'trips' : currentDay(cur()) ? 'trips' : 'packing';
  render(); setOnline(); setTimeout(notifyDue, 1500);
  if (migrated) setTimeout(() => dialog({title:`ย้ายข้อมูลเดิม ${migrated} ทริปแล้ว`, text:'รายจ่าย ตั๋ว และที่พักเดิมอยู่ในหน้างบประมาณ งบรวมเดิมใส่ไว้ในหมวด "อื่นๆ" ปรับแยกหมวดได้ที่ปุ่ม "ตั้งงบ"\nแนะนำกดสำรองข้อมูลเก็บไว้หนึ่งครั้ง', ok:'เข้าใจแล้ว', cancel:''}), 300);
  if (!ratesFresh()) fetchRates();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setupSW(); pruneUsage(); setTimeout(() => { flushOutbox(); sendUsage(); }, 4000);
  setTimeout(importInbox, 600);
  // ทางลัดจากไอคอนแอป (กดค้างที่ไอคอนบนหน้าจอโฮม): ?a=quick / menu / sos
  const sc = new URLSearchParams(location.search).get('a');
  if (sc) { history.replaceState(null, '', location.pathname);
    if (!cur()) toast('เลือกทริปก่อน', 'warn');
    else if (sc === 'quick') go('trips');
    else if (sc === 'menu') A.openMenuApp(null, null, true);
    else if (sc === 'sos') go('sos'); }
  if (!db.onboarded && !migrated) setTimeout(openOnb, 200);
  renderGate(); if (gateOn() && (!gate.access || gateLocked() || Date.now() - (gate.at || 0) > 12 * 3600e3)) setTimeout(() => gateCheck(false), 800);
})();
</script>
